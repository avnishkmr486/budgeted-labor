                <input type="text" value="{{ matrixSearch }}" onChange="{{ onMatrixSearch }}" style="height:28px; width:212px; border:1px solid #b5b5b5; border-radius:3px; padding:0 30px 0 8px; font-family:Arial, Helvetica, sans-serif; font-size:13.5px; color:#1f1f1f">
                <svg width="17" height="17" style="position:absolute; right:8px; color:#1f4e79; pointer-events:none"><use href="#ic-search"></use></svg>
              </span>
              <button type="button" style="height:30px; margin-left:14px; padding:0 18px; background:#015683; color:#ffffff; border:1px solid #01486e; border-radius:3px; font-family:Arial, Helvetica, sans-serif; font-size:14px; font-weight:700; cursor:pointer" data-hov="h5">Export</button>
            </div>

              <div style="padding:0 12px 16px 12px">
                <div style="display:flex; align-items:center; height:34px; background:#ededee; border:1px solid #d9d9d9">
                  <div style="flex:1 1 0; text-align:center; font-size:14px; font-weight:700">Index</div>
                  <div style="width:1px; align-self:stretch; background:#d9d9d9"></div>
                  <div style="flex:1 1 0; text-align:center; font-size:14px; font-weight:700">&gt;= Start Value</div>
                  <div style="width:1px; align-self:stretch; background:#d9d9d9"></div>
                  <div style="flex:1 1 0; text-align:center; font-size:14px; font-weight:700">&lt; End Value</div>
                  <div style="width:1px; align-self:stretch; background:#d9d9d9"></div>
                  <div style="flex:1 1 0; text-align:center; font-size:14px; font-weight:700">Total No Of Employee</div>
                </div>
                <sc-for list="{{ matrixRows }}" as="m">
                  <div style="display:flex; align-items:center; height:36px; border-left:1px solid #d9d9d9; border-right:1px solid #d9d9d9; border-bottom:1px solid #d9d9d9">
                    <div style="flex:1 1 0; padding-left:14px; font-size:14px">{{ m.index }}</div>
                    <div style="flex:1 1 0; padding-left:14px"><input type="text" value="{{ m.start }}" onChange="{{ m.onStart }}" style="height:22px; width:76px; border:1px solid #b5b5b5; border-radius:2px; text-align:right; padding:0 6px; font-family:Arial, Helvetica, sans-serif; font-size:13px"></div>
                    <div style="flex:1 1 0; padding-left:14px"><input type="text" value="{{ m.end }}" onChange="{{ m.onEnd }}" style="height:22px; width:76px; border:1px solid #b5b5b5; border-radius:2px; text-align:right; padding:0 6px; font-family:Arial, Helvetica, sans-serif; font-size:13px"></div>
                    <div style="flex:1 1 0; padding-left:14px"><input type="text" value="{{ m.emp }}" onChange="{{ m.onEmp }}" style="height:22px; width:76px; border:1px solid #b5b5b5; border-radius:2px; text-align:right; padding:0 6px; font-family:Arial, Helvetica, sans-serif; font-size:13px"></div>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ isOtherTab }}">
            <div style="margin-top:8px; border:1px solid #d9d9d9; border-radius:4px; background:#ffffff; box-shadow:0 1px 2px rgba(0,0,0,.10); padding:40px; text-align:center; font-size:14px; color:#6e6e6e">{{ otherTabLabel }}</div>
          </sc-if>
        </div>
      </sc-if>
    </div>

    <sc-if value="{{ pctOpen }}">
      <div style="position:absolute; inset:0; background:rgba(15,17,24,.45); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding-top:90px">
        <div style="width:520px; background:#ffffff; border:1px solid #b9b9b9; border-radius:4px; box-shadow:0 6px 22px rgba(0,0,0,.35)">
          <div style="display:flex; align-items:center; height:36px; background:#0b0b3b; color:#ffffff; font-size:15px; font-weight:700; padding:0 14px">
            <span style="flex:1">Update Matrices by Percentage</span>
            <span onClick="{{ closePct }}" style="cursor:pointer; font-size:17px; font-weight:700">&#215;</span>
          </div>
          <div style="padding:18px 18px 8px 18px">
            <div style="font-size:13.5px; color:#1f1f1f; margin-bottom:16px">{{ pctScopeText }}</div>
            <div style="display:flex; align-items:center; gap:14px; margin-bottom:14px">
              <div style="width:150px; flex:0 0 150px; font-size:13.5px; font-weight:700">Adjustment</div>
              <select value="{{ pctDir }}" onChange="{{ onPctDir }}" style="height:28px; width:130px; border:1px solid #b5b5b5; border-radius:3px; font-family:Arial, Helvetica, sans-serif; font-size:13.5px; padding:0 4px">
                <option value="inc">Increase</option>
                <option value="dec">Decrease</option>
              </select>
              <input type="text" value="{{ pctValue }}" onChange="{{ onPctValue }}" style="height:28px; width:90px; border:1px solid #b5b5b5; border-radius:3px; text-align:right; padding:0 8px; font-family:Arial, Helvetica, sans-serif; font-size:13.5px">
              <span style="font-size:13.5px; font-weight:700">%</span>
            </div>
            <div style="display:flex; align-items:center; gap:14px; margin-bottom:14px">
              <div style="width:150px; flex:0 0 150px; font-size:13.5px; font-weight:700">Apply To</div>
              <select value="{{ pctField }}" onChange="{{ onPctField }}" style="height:28px; width:236px; border:1px solid #b5b5b5; border-radius:3px; font-family:Arial, Helvetica, sans-serif; font-size:13.5px; padding:0 4px">
                <option value="both">Start &amp; End Values</option>
                <option value="start">Start Value only</option>
                <option value="end">End Value only</option>
                <option value="emp">Total No Of Employee</option>
              </select>
            </div>
            <div style="font-size:12.5px; color:#6e6e6e; line-height:1.5">Cap values (9,999.00) are left unchanged. Employee counts stay whole numbers.</div>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:10px; padding:14px 18px 16px 18px; border-top:1px solid #e2e2e2; margin-top:10px">
            <button type="button" onClick="{{ closePct }}" style="height:30px; padding:0 18px; background:#ffffff; color:#1a5c8f; border:1px solid #cfd6dc; border-radius:3px; font-family:Arial, Helvetica, sans-serif; font-size:14px; font-weight:700; cursor:pointer">Cancel</button>
            <button type="button" onClick="{{ applyPct }}" style="{{ applyBtnStyle }}">Apply</button>
          </div>
        </div>
      </div>
    </sc-if>

    <!-- ============ EXPANDED NAV DRAWER ============ -->
    <div style="{{ drawerStyle }}">
      <div style="display:flex; align-items:center; gap:14px; height:50px; flex:0 0 50px; padding:0 0 0 15px; background:#292b37">
        <img src="assets/AltametricsIcon.svg" alt="Altametrics" style="width:30px; height:30px; display:block">
        <span style="color:#ffffff; font-size:19px; font-weight:700; letter-spacing:.2px">Altametrics</span>
        <div style="flex:1"></div>
        <button type="button" onClick="{{ toggleNav }}" title="Collapse menu" style="width:54px; height:50px; flex:0 0 54px; border:none; background:transparent; color:#ffffff; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0" data-hov="h1">
          <svg width="22" height="16" viewBox="0 0 24 18" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"><path d="M1.5 1.5h21M1.5 9h21M1.5 16.5h21"></path></svg>
        </button>
      </div>
      <div style="flex:1; overflow-y:auto; overflow-x:hidden; background:#292b37">
        <sc-for list="{{ navRows }}" as="row">
          <button type="button" onClick="{{ row.onClick }}" style="{{ row.style }}">
            <sc-if value="{{ row.is_home }}"><svg width="24" height="24" style="flex:0 0 24px; margin-right:16px"><use href="#ic-home"></use></svg></sc-if>
            <sc-if value="{{ row.is_cash }}"><svg width="24" height="24" style="flex:0 0 24px; margin-right:16px"><use href="#ic-cash"></use></svg></sc-if>
            <sc-if value="{{ row.is_food }}"><svg width="24" height="24" style="flex:0 0 24px; margin-right:16px"><use href="#ic-food"></use></svg></sc-if>
            <sc-if value="{{ row.is_labor }}"><svg width="24" height="24" style="flex:0 0 24px; margin-right:16px"><use href="#ic-labor"></use></svg></sc-if>
            <sc-if value="{{ row.is_report }}"><svg width="24" height="24" style="flex:0 0 24px; margin-right:16px"><use href="#ic-report"></use></svg></sc-if>
            <sc-if value="{{ row.is_admin }}"><svg width="24" height="24" style="flex:0 0 24px; margin-right:16px"><use href="#ic-admin"></use></svg></sc-if>
            <sc-if value="{{ row.is_help }}"><svg width="24" height="24" style="flex:0 0 24px; margin-right:16px"><use href="#ic-help"></use></svg></sc-if>
            <span style="flex:1; text-align:left">{{ row.label }}</span>
            <sc-if value="{{ row.expandable }}">
              <svg width="15" height="15" style="{{ row.chevronStyle }}"><use href="#ic-chevron"></use></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</template>

<script src="app.js"></script>
</body>
</html>
